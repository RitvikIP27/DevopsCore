apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-deployment
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
      - name: sample-python-app
        image: ritvikkantip/python-web-app:v1 
        envFrom:
          - configMapRef: 
             name: myconfigmap
        ports:
        - containerPort: 8000

